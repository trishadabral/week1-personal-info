{% extends "base.html" %}
{% block content %}

<div class="card shadow-sm">
  <div class="card-body">
    <h2>{{ post.title }}</h2>
    <p class="text-muted">
        By <strong>{{ post.author.username }}</strong> on {{ post.timestamp.strftime('%B %d, %Y') }}
    </p>
    <hr>
    <p style="white-space: pre-line;">{{ post.content }}</p>
  </div>
</div>

<a href="{{ url_for('main.index') }}" class="btn btn-link mt-3">← Back to Home</a>

{% endblock %}
